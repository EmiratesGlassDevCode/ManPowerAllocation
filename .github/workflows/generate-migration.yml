name: Generate EF migration

# Manually-triggered helper that scaffolds an EF Core migration on a runner (which has the
# .NET SDK and NuGet access) and commits it back to the branch. Migration scaffolding does not
# touch a database — it only reads the model. Provide a migration name when dispatching; it
# defaults to InitialCreate for the first run.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Migration name (e.g. AddShiftSettings)"
        required: true
        default: "InitialCreate"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate migration
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.8
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations add "${{ github.event.inputs.name }}" \
            --context ManpowerDbContext \
            -p src/ManpowerAllocation.Infrastructure \
            -s src/ManpowerAllocation.Web

      - name: Commit and push the migration
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ManpowerAllocation.Infrastructure/Migrations
          git commit -m "Add ${{ github.event.inputs.name }} EF Core migration (generated in CI)" \
                     -m "Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
          git push
