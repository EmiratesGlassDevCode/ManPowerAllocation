<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" role="img" aria-label="Emirates Glass">
  <title>Emirates Glass</title>
  <!-- Emblem: navy tile with gold diagonal panes, echoing the corporate mark -->
  <g>
    <rect x="0" y="6" width="60" height="60" rx="6" fill="#12446b"/>
    <g fill="#b8935a">
      <polygon points="10,58 24,58 44,14 30,14"/>
      <polygon points="30,58 40,58 56,22 46,22"/>
    </g>
    <polygon points="10,58 18,58 34,20 26,20" fill="#e8edf2" opacity="0.9"/>
  </g>
  <!-- Wordmark -->
  <text x="74" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#b8935a">Emirates</text>
  <text x="74" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#12446b">Glass</text>
</svg>
