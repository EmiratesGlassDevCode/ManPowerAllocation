document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"height:1px; background:#E0E0E0; margin:8px 12px\"><\u002Fdiv>\n          <div style=\"font-size:12px; line-height:16px; font-weight:600; color:#616161; padding:6px 12px\">System pages<\u002Fdiv>\n          <sc-for list=\"{{ systemNav }}\" as=\"item\" hint-placeholder-count=\"2\">\n            <div sc-camel-on-click=\"{{ item.onClick }}\" style=\"{{ item.style }}\" style-hover=\"background:#F0F0F0\">\n              <div style=\"{{ item.indicator }}\"><\u002Fdiv>\n              <div style=\"{{ item.iconStyle }}\"><\u002Fdiv>\n              <span style=\"flex:1\">{{ item.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"margin-top:auto; background:#EBF3FC; border-radius:4px; padding:12px; display:flex; flex-direction:column; gap:2px\">\n            <span style=\"font-size:12px; line-height:16px; font-weight:600; color:#115EA3\">Attendance sync<\u002Fspan>\n            <span style=\"font-size:12px; line-height:16px; color:#424242\">{{ syncSidebarLine }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Faside>\n\n        <main style=\"padding:20px 24px 48px; display:flex; flex-direction:column; gap:16px; max-width:1600px; min-width:0\">\n\n          <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap\">\n            <div style=\"display:flex; flex-direction:column; gap:2px\">\n              <span style=\"font-size:12px; line-height:16px; color:#616161\">{{ crumb }}<\u002Fspan>\n              <h1 style=\"margin:0; font-size:28px; line-height:36px; font-weight:600\">{{ pageTitle }}<\u002Fh1>\n              <span style=\"font-size:14px; line-height:20px; color:#616161; max-width:820px\">{{ pageHint }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showShift }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex; align-items:center; gap:8px\">\n quired }}<\u002Fspan>\n                  <span style=\"{{ factoryVarStyle }}\">net variance {{ factoryVariance }}<\u002Fspan>\n                  <div style=\"flex:1\"><\u002Fdiv>\n                  <span style=\"font-size:12px; line-height:16px; color:#616161\">{{ shiftScopeLine }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:#FFFFFF; border-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12); overflow:hidden\">\n                <div style=\"padding:12px 16px; border-bottom:1px solid #E0E0E0; background:#F5F8FC; display:flex; align-items:center; gap:8px\">\n                  <div style=\"width:14px; height:14px; border-radius:3px; background:#0F6CBD\"><\u002Fdiv>\n                  <span style=\"font-size:16px; line-height:22px; font-weight:600\">Division breakdown<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:1.4fr repeat(7,minmax(0,1fr)); font-size:12px; line-height:16px; font-weight:600; color:#424242; background:#FAFAFA; border-bottom:1px solid #E0E0E0\">\n                  <sc-for list=\"{{ breakdownHead }}\" as=\"h\" hint-placeholder-count=\"8\">\n                    <div style=\"{{ h.style }}\">{{ h.label }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <sc-for list=\"{{ breakdownRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <div style=\"display:grid; grid-template-columns:1.4fr repeat(7,minmax(0,1fr)); border-bottom:1px solid #F5F5F5\" style-hover=\"background:#F5F8FC\">\n                    <div style=\"padding:10px 16px; font-size:14px; line-height:20px; font-weight:600; display:flex; align-items:center; gap:8px\">\n                      <div style=\"{{ r.dotStyle }}\"><\u002Fdiv>{{ r.label }}\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"7\">\n                      <div style=\"{{ c.style }}\">{{ c.v }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px\">\n                <sc-for list=\"{{ summaryPanels }}\" as=\"p\" hint-placeholder-count=\"4\">\n                  <div style=\"background:#FFFFFF; border-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12); overflow:hidden; display:flex; flex-direction:column\">\n                    <div style=\"{{ p.headStyle }}\">\n                      <div style=\"{{ p.iconStyle }}\"><\u002Fdiv>\n                      <span style=\"{{ p.titleStyle }}\">{{ p.title }}<\u002Fspan>\n                      <div style=\"flex:1\"><\u002Fdiv>\n                      <span style=\"{{ p.countStyle }}\">{{ p.count }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ p.items }}\" as=\"i\" hint-placeholder-count=\"3\">\n                      <div style=\"display:flex; align-items:center; gap:10px; padding:9px 16px; border-bottom:1px solid #F5F5F5\" style-hover=\"background:#FAFAFA\">\n                        <div style=\"{{ i.avatarStyle }}\">{{ i.initials }}<\u002Fdiv>\n                        <span style=\"flex:1; min-width:80px; font-size:14px; line-height:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ i.main }}<\u002Fspan>\n                        <span style=\"font-size:12px; line-height:16px; color:#616161\">{{ i.sub }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ p.empty }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"padding:18px 16px; font-size:14px; line-height:20px; color:#616161\">Nothing to report.<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isDivision }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:16px\">\n              <section style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px\">\n                <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"8\">\n                  <div style=\"background:#FFFFFF; border-radius:4px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12)\">\n                    <div style=\"{{ k.stripStyle }}\"><\u002Fdiv>\n                    <div style=\"padding:12px 14px; display:flex; flex-direction:column; gap:2px\">\n                      <span style=\"font-size:12px; line-height:16px; font-weight:600; color:#424242\">{{ k.label }}<\u002Fspan>\n                      <span style=\"{{ k.valueStyle }}\">{{ k.value }}<\u002Fspan>\n                      <span style=\"font-size:12px; line-height:16px; color:#616161\">{{ k.hint }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsection>\n\n              <div style=\"display:flex; align-items:center; gap:8px; flex-wrap:wrap\">\n                <div style=\"display:flex; align-items:center; gap:8px; background:#FFFFFF; border:1px solid #D1D1D1; border-bottom:2px solid #0F6CBD; border-radius:4px; padding:0 10px; height:32px; width:260px\">\n                  <span style=\"color:#0F6CBD\">⌕<\u002Fspan>\n                  <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Search department…\" style=\"border:none; outline:none; background:transparent; font-size:14px; line-height:20px; width:100%; color:#242424\">\n                <\u002Fdiv>\n                <sc-for list=\"{{ statusFilters }}\" as=\"f\" hint-placeholder-count=\"5\">\n                  <div sc-camel-on-click=\"{{ f.onClick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"flex:1\"><\u002Fdiv>\n                <div sc-camel-on-click=\"{{ allOn }}\" style=\"height:32px; padding:0 12px; display:flex; align-items:center; border:1px solid #D1D1D1; background:#FFFFFF; border-radius:4px; font-size:14px; line-height:20px; cursor:pointer; flex:none; white-space:nowrap\" style-hover=\"background:#F5F5F5\">All ON<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ allOff }}\" style=\"height:32px; padding:0 12px; display:flex; align-items:center; border:1px solid #D1D1D1; background:#FFFFFF; border-radius:4px; font-size:14px; line-height:20px; cursor:pointer; flex:none; white-space:nowrap\" style-hover=\"background:#F5F5F5\">All OFF<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ openAddDept }}\" style=\"height:32px; padding:0 12px; display:flex; align-items:center; gap:6px; background:#0F6CBD; color:#FFFFFF; border-radius:4px; font-size:14px; line-height:20px; font-weight:600; cursor:pointer; flex:none; white-space:nowrap\" style-hover=\"background:#115EA3\">+ Add department<\u002Fdiv>\n              <\u002Fdiv>\n\n              <section style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px\">\n                <sc-for list=\"{{ depts }}\" as=\"d\" hint-placeholder-count=\"6\">\n                  <div style=\"{{ d.cardStyle }}\">\n                    <div style=\"{{ d.headerStyle }}\">\n                      <div style=\"{{ d.tileStyle }}\">{{ d.initials }}<\u002Fdiv>\n                      <div style=\"display:flex; flex-direction:column; gap:1px; flex:1; min-width:0\">\n                        <span style=\"font-size:16px; line-height:22px; font-weight:600\">{{ d.name }}<\u002Fspan>\n                        <span style=\"font-size:12px; line-height:16px; color:#616161\">{{ d.subtitle }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div sc-camel-on-click=\"{{ d.onToggle }}\"                   <span sc-camel-on-click=\"{{ d.onEdit }}\" style=\"height:28px; padding:0 10px; display:flex; align-items:center; font-size:14px; line-height:20px; cursor:pointer; border:1px solid #D1D1D1; border-radius:4px\" style-hover=\"background:#EBF3FC; border-color:#0F6CBD; color:#115EA3\">Edit<\u002Fspan>\n                        <span style=\"height:28px; padding:0 10px; display:flex; align-items:center; font-size:14px; line-height:20px; color:#B10E1C; cursor:pointer; border:1px solid #D1D1D1; border-radius:4px\" style-hover=\"background:#FDF3F4; border-color:#B10E1C\">Delete<\u002Fspan>\n                      <\u002Fdiv>\n\n                      <sc-if value=\"{{ d.open }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"border:1px solid #E0E0E0; border-radius:4px; overflow:hidden\">\n                          <div style=\"display:flex; align-items:center; gap:10px; padding:6px 12px; background:#F5F8FC; border-bottom:1px solid #E0E0E0; font-size:12px; line-height:16px; color:#424242; font-weight:600\">\n                            <span style=\"flex:1; min-width:80px\">Name<\u002Fspan>\n                            <span style=\"width:44px\">Shift<\u002Fspan>\n                            <span style=\"width:76px; text-align:right\">Status<\u002Fspan>\n                          <\u002Fdiv>\n                          <sc-for list=\"{{ d.people }}\" as=\"p\" hint-placeholder-count=\"4\">\n                            <div style=\"display:flex; flex-direction:column; gap:6px; padding:8px 12px; border-bottom:1px solid #F5F5F5\" style-hover=\"background:#F5F8FC\">\n                              <div style=\"display:flex; align-items:center; gap:10px\">\n                                <div style=\"{{ p.avatarStyle }}\">{{ p.initials }}<\u002Fdiv>\n                                <span style=\"flex:1; min-width:80px; font-size:14px; line-height:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ p.n }}<\u002Fspan>\n                                <span style=\"{{ p.shiftStyle }}\">{{ p.s }}<\u002Fspan>\n                                <span style=\"{{ p.statusStyle }}\">{{ p.st }}<\u002Fspan>\n                              <\u002Fdiv>\n                              <sc-if value=\"{{ p.canEdit }}\" hint-placeholder-val=\"{{ false }}\">\n                                <div style=\"display:flex; align-items:center; gap:6px; padding-left:36px; flex-wrap:wrap\">\n                                  <span sc-camel-on-click=\"{{ p.onVac }}\" style=\"height:24px; padding:0 8px; display:flex; align-items:center; border:1px solid #D1D1D1; border-radius:4px; font-size:12px; line-height:16px; cursor:pointer\" style-hover=\"background:#FFF9F5; border-color:#BC4B09; color:#8A3707\">{{ p.vacLabel }}<\u002Fspan>\n                                  <span sc-camel-on-click=\"{{ p.onShift }}\" style=\"height:24px; padding:0 8px; display:flex; align-items:center; border:1px solid #D1D1D1; border-radius:4px; font-size:12px; line-height:16px; cursor:pointer\" style-hover=\"background:#EBF3FC; border-color:#0F6CBD; color:#115EA3\">↔ Shift<\u002Fspan>\n                                  <sc-raw-select value=\"{{ p.moveValue }}\" sc-camel-on-change=\"{{ p.onMove }}\" style=\"height:24px; border:1px solid #D1D1D1; border-radius:4px; font-size:12px; background:#FFFFFF; color:#424242\">\n                                    <option value=\"0\">Move to…<\u002Foption>\n                                    <sc-for list=\"{{ p.moveTargets }}\" as=\"t\" hint-placeholder-count=\"3\">\n                                      <option value=\"{{ t.value }}\">{{ t.label }}<\u002Foption>\n                                    <\u002Fsc-for>\n                                  <\u002Fsc-raw-select>\n                                <\u002Fdiv>\n                              <\u002Fsc-if>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsection>\n\n              <sc-if value=\"{{ noDepts }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:#FFFFFF; border:1px solid #E0E0E0; border-radius:4px; padding:40px; text-align:center; color:#616161; font-size:14px; line-height:20px\">No departments match this filter.<\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px\">\n                <sc-for list=\"{{ divisionPanels }}\" as=\"p\" hint-placeholder-count=\"4\">\n                  <div style=\"background:#FFFFFF; border-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12); overflow:hidden\">\n                    <div style=\"{{ p.headStyle }}\">\n                      <div style=\"{{ p.iconStyle }}\"><\u002Fdiv>\n                      <span style=\"{{ p.titleStyle }}\">{{ p.title }}<\u002Fspan>\n                      <div style=\"flex:1\"><\u002Fdiv>\n                      <span style=\"{{ p.countStyle }}\">{{ p.count }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ p.items }}\" as=\"i\" hint-placeholder-count=\"3\">\n                      <div style=\"display:flex; align-items:center; gap:10px; padding:9px 16px; border-bottom:1px solid #F5F5F5\" style-hover=\"background:#FAFAFA\">\n                        <div style=\"{{ i.avatarStyle }}\">{{ i.initials }}<\u002Fdiv>\n                        <span style=\"flex:1; min-width:80px; font-size:14px; line-height:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ i.main }}<\u002Fspan>\n                        <span style=\"font-size:12px; line-height:16px; color:#616161\">{{ i.sub }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ p.empty }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"padding:18px 16px; font-size:14px; line-height:20px; color:#616161\">Nothing to report.<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isSearch }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:12px\">\n              <div style=\"display:flex; align-items:center; gap:8px; background:#FFFFFF; border:1px solid #D1D1D1; border-bottom:2px solid #0F6CBD; border-radius:4px; padding:0 10px; height:32px; width:320px\">\n                <span style=\"color:#0F6CBD\">⌕<\u002Fspan>\n                <input value=\"{{ term }}\" sc-camel-on-change=\"{{ onTerm }}\" placeholder=\"Name or ID…\" style=\"border:none; outline:none; background:transparent; font-size:14px; line-height:20px; width:100%; color:#242424\">\n              <\u002Fdiv>\n              <sc-if value=\"{{ searchIdle }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"background:#FFFFFF; border:1px solid #E0E0E0; border-radius:4px; padding:40px; text-align:center; color:#616161; font-size:14px; line-height:20px\">Type at least two characters to search all divisions.<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ searchHasResults }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:#FFFFFF; border-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12); overflow-x:auto\"><div style=\"min-width:820px\">\n                  <div style=\"display:grid; grid-template-columns:minmax(190px,1.6fr) minmax(86px,.8fr) minmax(120px,1fr) minmax(140px,1.2fr) minmax(70px,.6fr) minmax(94px,.8fr) minmax(120px,1.2fr); background:#F5F8FC; border-bottom:1px solid #E0E0E0; font-size:12px; line-height:16px; font-weight:600; color:#424242\">\n                    <sc-for list=\"{{ searchHead }}\" as=\"h\" hint-placeholder-count=\"7\">\n                      <div style=\"padding:8px 14px\">{{ h.label }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ searchRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                    <div style=\"display:grid; grid-template-columns:minmax(190px,1.6fr) minmax(86px,.8fr) minmax(120px,1fr) minmax(140px,1.2fr) minmax(70px,.6fr) minmax(94px,.8fr) minmax(120px,1.2fr); border-bottom:1px solid #F5F5F5; align-items:center\" style-hover=\"background:#F5F8FC\">\n                      <div style=\"padding:9px 14px; display:flex; align-items:center; gap:10px; min-width:0\">\n                        <div style=\"{{ r.avatarStyle }}\">{{ r.initials }}<\u002Fdiv>\n                        <span style=\"font-size:14px; line-height:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ r.name }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"padding:9px 14px; font-size:13px; line-height:20px; color:#424242\">{{ r.badge }}<\u002Fdiv>\n                      <div style=\"padding:9px 14px; font-size:13px; line-height:20px\">{{ r.division }}<\u002Fdiv>\n                      <div style=\"padding:9px 14px; font-size:13px; line-height:20px\">{{ r.dept }}<\u002Fdiv>\n                      <div style=\"padding:9px 14px\"><span style=\"{{ r.shiftStyle }}\">{{ r.shift }}<\u002Fspan><\u002Fdiv>\n                      <div style=\"padding:9px 14px\"><span style=\"{{ r.statusStyle }}\">{{ r.status }}<\u002Fspan><\u002Fdiv>\n                      <div style=\"padding:9px 14px; font-size:12px; line-height:16px; color:#616161\">{{ r.notes }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ searchNoMatch }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:#FDF3F4; border:1px solid #F1BBBB; border-radius:4px; padding:14px 16px; color:#8B0A11; font-size:14px; line-height:20px\">No matches for that name or ID.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isRoles }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:12px\">\n              <div style=\"background:#FFFFFF; border-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12); padding:16px; display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap\">\n                <label style=\"display:flex; flex-direction:column; gap:4px; font-size:12px; line-height:16px; font-weight:600; color:#424242\">Entra object id\n                  <input placeholder=\"00000000-0000-0000-0000-000000000000\" style=\"width:340px; height:32px; padding:0 10px; border:1px solid #D1D1D1; border-bottom:2px solid #0F6CBD; border-radius:4px; font-size:14px; color:#242424\">\n                <\u002Flabel>\n                <label style=\"display:flex; flex-direction:column; gap:4px; font-size:12px; line-height:16px; font-weight:600; color:#424242\">Display name\n                  <input placeholder=\"Firstname Lastname\" style=\"width:220px; height:32px; padding:0 10px; border:1px solid #D1D1D1; border-bottom:2px solid #0F6CBD; border-radius:4px; font-size:14px; color:#242424\">\n                <\u002Flabel>\n                <label style=\"display:flex; flex-direction:column; gap:4px; font-size:12px; line-height:16px; font-weight:600; color:#424242\">Role\n                  <sc-raw-select style=\"height:32px; padding:0 8px; border:1px solid #D1D1D1; border-radius:4px; font-size:14px; background:#FFFFFF\">\n                    <option>Viewer<\u002Foption>\n                    <option>User<\u002Foption>\n                    <option>Admin<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n Fdiv>\n                    <div style=\"padding:9px 14px\"><span style=\"font-size:13px; color:#B10E1C; cursor:pointer\" style-hover=\"text-decoration:underline\">Remove<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isImport }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:12px; align-items:start\">\n              <div style=\"background:#FFFFFF; border-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12); overflow:hidden\">\n                <div style=\"padding:12px 16px; background:#EBF3FC; border-bottom:1px solid #B4D6FA; display:flex; align-items:center; gap:8px\">\n                  <div style=\"width:14px; height:14px; border-radius:3px; background:#0F6CBD\"><\u002Fdiv>\n                  <span style=\"font-size:16px; line-height:22px; font-weight:600; color:#0C3B5E\">Attendance workbook<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"padding:16px; display:flex; flex-direction:column; gap:12px\">\n                  <span style=\"font-size:14px; line-height:20px; color:#424242\">Sheets recognised: EGL · Functional Support · BRG.<\u002Fspan>\n                  <label style=\"display:flex; align-items:center; gap:8px; font-size:14px; line-height:20px; cursor:pointer\">\n                    <div style=\"width:16px; height:16px; border:1px solid #616161; border-radius:3px\"><\u002Fdiv>\n                    Replace employees for divisions that already contain data\n                  <\u002Flabel>\n                  <div style=\"border:1px dashed #B4D6FA; background:#FAFCFF; border-radius:4px; padding:22px; display:flex; flex-direction:column; align-items:center; gap:6px\">\n                    <span style=\"font-size:14px; line-height:20px; font-weight:600; color:#115EA3\">Drop .xlsx ht:600; cursor:pointer; flex:none; white-space:nowrap\" style-hover=\"background:#02565A\">Choose file<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"grid-column:1 / -1; background:#F1FAF1; border:1px solid #9FD89F; border-radius:4px; padding:14px 16px; display:flex; flex-direction:column; gap:8px\">\n                <span style=\"font-size:14px; line-height:20px; font-weight:600; color:#0B5A0B\">Last import result<\u002Fspan>\n                <div style=\"display:flex; gap:24px; flex-wrap:wrap\">\n                  <sc-for list=\"{{ importStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex; flex-direction:column\">\n                      <span style=\"font-size:20px; line-height:26px; font-weight:600; color:#0E700E\">{{ s.v }}<\u002Fspan>\n                      <span style=\"font-size:12px; line-height:16px; color:#424242\">{{ s.k }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <span style=\"font-size:12px; line-height:16px; color:#424242\">1 warning: sheet \"BRG\" row 42 — unknown department \"Site Works B\", skipped.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isAttendance }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:12px; align-items:start\">\n              <div style=\"background:#FFFFFF; border-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12); overflow:hidden\">\n                <div style=\"{{ syncHeadStyle }}\">\n                  <div style=\"{{ syncHeadIconStyle }}\"><\u002Fdiv>\n                  <span style=\"{{ syncHeadTitleStyle }}\">{{ syncHeadTitle }}<\u002Fspan>\n                  <div style=\"flex:1\"><\u002Fdiv>\n                  <span style=\"font-size:12px; line-height:16px; color:#424242\">{{ syncRanAt }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"padding:16px; display:flex; flex-direction:column; gap:14px\">\n                  <div style=\"display:flex; align-items:center; gap:10px\">\n                    <div sc-camel-on-click=\"{{ onSyncNow }}\" style=\"{{ syncButtonStyle }}\">{{ syncButtonLabel }}<\u002Fdiv>\n                    <span style=\"font-size:12px; line-height:16px; color:#616161\">Background job runs every 10 minutes.<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px\">\n                    <sc-for list=\"{{ syncStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n                      <div style=\"{{ s.cardStyle }}\">\n                        <span style=\"{{ s.valueStyle }}\">{{ s.v }}<\u002Fspan>\n                        <span style=\"font-size:12px; line-height:16px; color:#424242\">{{ s.k }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:#FFFFFF; border-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12); overflow:hidden\">\n                <div style=\"padding:12px 16px; background:#F5F8FC; border-bottom:1px solid #E0E0E0; font-size:16px; line-height:22px; font-weight:600\">Sync rules<\u002Fdiv>\n                <div style=\"padding:6px 0\">\n                  <sc-for list=\"{{ syncRules }}\" as=\"r\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex; gap:10px; padding:10px 16px; border-bottom:1px solid #F5F5F5\">\n                      <div style=\"{{ r.dotStyle }}\"><\u002Fdiv>\n                      <span style=\"font-size:14px; line-height:20px; color:#242424\">{{ r.text }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isShiftSettings }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; align-items:start\">\n              <div style=\"background:#FFFFFF; border-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12); overflow:hidden\">\n                <div style=\"padding:12px 16px; background:#FFF9F5; border-bottom:1px solid #F4C7A8; display:flex; align-items:center; gap:8px\">\n                  <div style=\"width:14px; height:14px; border-radius:3px; background:#BC4B09\"><\u002Fdiv>\n                  <span style=\"font-size:16px; line-height:22px; font-weight:600; color:#8A3707\">Shift boundaries<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"padding:16px; display:flex; flex-direction:column; gap:14px\">\n                  <div style=\"display:flex; gap:12px; flex-wrap:wrap\">\n                    <label style=\"display:flex; flex-direction:column; gap:4px; font-size:12px; line-height:16px; font-weight:600; color:#424242\">Day shift start\n                      <input type=\"time\" value=\"{{ dayStart }}\" sc-camel-on-change=\"{{ onDayStart }}\" style=\"height:32px; padding:0 10px; border:1px solid #D1D1D1; border-bottom:2px solid #0F6CBD; border-radius:4px; font-size:14px; color:#242424\">\n                    <\u002Flabel>\n                    <label style=\"display:flex; flex-direction:column; gap:4px; font-size:12px; line-height:16px; font-weight:600; color:#424242\">Night shift start\n                      <input type=\"time\" value=\"{{ nightStart }}\" sc-camel-on-change=\"{{ onNightStart }}\" style=\"height:32px; padding:0 10px; border:1px solid #D1D1D1; border-bottom:2px solid #0F6CBD; border-radius:4px; font-size:14px; color:#242424\">\n                    <\u002Flabel>\n                    <div style=\"align-self:flex-end; height:32px; padding:0 14px; display:flex; align-items:center; background:#0F6CBD; color:#FFFFFF; border-radius:4px; font-size:14px; font-weight:600; cursor:pointer; flex:none; white-space:nowrap\" style-hover=\"background:#115EA3\">Save<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; height:34px; border-radius:4px; overflow:hidden; border:1px solid #E0E0E0\">\n                    <div style=\"{{ dayBandStyle }}\">{{ dayBandLabel }}<\u002Fdiv>\n                    <div style=\"{{ nightBandStyle }}\">{{ nightBandLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font-size:12px; line-height:16px; color:#616161\">The day start also sets the operational-day boundary: a night worker who clocks in the evening stays counted present until this time next morning.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:#EBF3FC; border:1px solid #B4D6FA; border-radius:4px; padding:16px; display:flex; flex-direction:column; gap:6px\">\n                <span style=\"font-size:14px; line-height:20px; font-weight:600; color:#0C3B5E\">Current setting<\u002Fspan>\n                <span style=\"font-size:20px; line-height:26px; font-weight:600; color:#115EA3\">{{ shiftSummaryLine }}<\u002Fspan>\n                <span style=\"font-size:12px; line-height:16px; color:#424242\">Last changed 2026-07-14 09:31 (Asia/Dubai) by s.mubarak.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isBreakGlass }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:12px\">\n              <div style=\"background:#FDF3F4; border:1px solid #F1BBBB; border-left:4px solid #B10E1C; border-radius:4px; padding:14px 16px; display:flex; flex-direction:column; gap:6px\">\n                <span style=\"font-size:14px; line-height:20px; font-weight:600; color:#8B0A11\">Disabled by default — database change required to enable<\u002Fspan>\n                <span style=\"font-size:14px; line-height:20px; color:#424242\">This account exists only for when Entra ID is unreachable. It cannot be enabled from any screen. On enable and on every login the IT Head is alerted; it auto-disables four hours after enabling, and every action in a break-glass session is flagged in the audit trail.<\u002Fspan>\n              <\u002Fdiv>\n\n              <div style=\"background:#FFFFFF; border-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12); overflow:hidden\">\n                <div style=\"padding:12px 16px; background:#F5F8FC; border-bottom:1px solid #E0E0E0; display:flex; align-items:center; gap:10px\">\n                  <span style=\"font-size:16px; line-height:22px; font-weight:600\">Account status<\u002Fspan>\n                  <span style=\"height:20px; padding:0 8px; border-radius:10px; background:#F1FAF1; color:#0E700E; border:1px solid #9FD89F; font-size:12px; line-height:18px; font-weight:600\">Disabled<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ breakGlassRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                  <div style=\"display:grid; grid-template-columns:260px 1fr; border-bottom:1px solid #F5F5F5\">\n                    <div style=\"padding:10px 16px; font-size:13px; line-height:20px; font-weight:600; color:#424242; background:#FAFAFA\">{{ r.k }}<\u002Fdiv>\n                    <div style=\"padding:10px 16px; font-size:14px; line-height:20px\">{{ r.v }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isAudit }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:12px\">\n              <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap\">\n                <div sc-camel-on-click=\"{{ onToggleBg }}\" style=\"{{ bgFilterStyle }}\">\n                  <div style=\"{{ bgCheckStyle }}\"><\u002Fdiv>\n                  Show only break-glass sessions\n                <\u002Fdiv>\n                <span style=\"font-size:12px; line-height:16px; color:#616161\">{{ auditCountLine }}<\u002Fspan>\n              <\u002Fdiv>\n\n              <div style=\"background:#FFFFFF; border-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12); overflow:hidden\">\n                <div style=\"display:grid; grid-template-columns:32px 1.3fr 1.2fr .8fr 1fr .7fr .9fr; background:#F5F8FC; border-bottom:1px solid #E0E0E0; font-size:12px; line-height:16px; font-weight:600; color:#424242\">\n                  <div style=\"padding:8px 6px\"><\u002Fdiv>\n                  <div style=\"padding:8px 12px\">Time (Asia/Dubai)<\u002Fdiv>\n                  <div style=\"padding:8px 12px\">User<\u002Fdiv>\n                  <div style=\"padding:8px 12px\">Action<\u002Fdiv>\n                  <div style=\"padding:8px 12px\">Entity<\u002Fdiv>\n                  <div style=\"padding:8px 12px\">Record<\u002Fdiv>\n                  <div style=\"padding:8px 12px\">Break-glass<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ auditRows }}\" as=\"a\" hint-placeholder-count=\"6\">\n                  <div style=\"border-bottom:1px solid #F5F5F5\">\n                    <div sc-camel-on-click=\"{{ a.onToggle }}\" style=\"{{ a.rowStyle }}\" style-hover=\"background:#F5F8FC\">\n                      <div style=\"padding:9px 6px; text-align:center; color:#616161\">{{ a.caret }}<\u002Fdiv>\n                      <div style=\"padding:9px 12px; font-size:13px; line-height:20px\">{{ a.time }}<\u002Fdiv>\n                      <div style=\"padding:9px 12px; font-size:13px; line-height:20px\">{{ a.user }}<\u002Fdiv>\n                      <div style=\"padding:9px 12px\"><span style=\"{{ a.actionStyle }}\">{{ a.action }}<\u002Fspan><\u002Fdiv>\n                      <div style=\"padding:9px 12px; font-size:13px; line-height:20px\">{{ a.entity }}<\u002Fdiv>\n                      <div style=\"padding:9px 12px; font-size:13px; line-height:20px; color:#616161\">{{ a.record }}<\u002Fdiv>\n                      <div style=\"padding:9px 12px\">{{ a.bgLabel }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ a.open }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px 16px 16px 38px; background:#FAFAFA\">\n                        <div style=\"display:flex; flex-direction:column; gap:6px\">\n                          <span style=\"font-size:12px; line-height:16px; font-weight:600; color:#B10E1C\">Before<\u002Fspan>\n                          <pre style=\"margin:0; padding:12px; background:#FFFFFF; border:1px solid #E0E0E0; border-radius:4px; font-family:Consolas,monospace; font-size:12px; line-height:18px; color:#424242; overflow:auto\">{{ a.before }}<\u002Fpre>\n                        <\u002Fdiv>\n                        <div style=\"display:flex; flex-direction:column; gap:6px\">\n                          <span style=\"font-size:12px; line-height:16px; font-weight:600; color:#0E700E\">After<\u002Fspan>\n                          <pre style=\"margin:0; padding:12px; background:#FFFFFF; border:1px solid #E0E0E0; border-radius:4px; font-family:Consolas,monospace; font-size:12px; line-height:18px; color:#424242; overflow:auto\">{{ a.after }}<\u002Fpre>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n        <\u002Fmain>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh; background:linear-gradient(160deg,#0F548C,#0C3B5E); display:flex; align-items:center; justify-content:center; padding:32px\">\n      <div style=\"width:420px; background:#FFFFFF; border-radius:8px; box-shadow:0 32px 64px rgba(0,0,0,.24); overflow:hidden\">\n        <div style=\"height:4px; background:#B10E1C\"><\u002Fdiv>\n        <div style=\"padding:28px; display:flex; flex-direction:column; gap:16px\">\n          <div style=\"display:flex; flex-direction:column; gap:8px\">\n            <img src=\"928de21f-62e9-438c-baa6-a548af72e8d7\" alt=\"Emirates Glass\" style=\"height:26px; width:auto; align-self:flex-start; display:block\">\n            <span style=\"font-size:12px; line-height:16px; color:#616161\">Manpower Allocation<\u002Fspan>\n          <\u002Fdiv>\n          <h1 style=\"margin:0; font-size:28px; line-height:36px; font-weight:600\">Emergency Access<\u002Fh1>\n          <div style=\"background:#FDF3F4; border:1px solid #F1BBBB; border-radius:4px; padding:12px; font-size:13px; line-height:19px; color:#424242\">\n            Use this page only when Entra ID sign-in is unavailable. Access is temporary, alerts the IT Head, and is recorded distinctly in the audit trail.\n          <\u002Fdiv>\n          <label style=\"display:flex; flex-direction:column; gap:4px; font-size:12px; line-height:16px; font-weight:600; color:#424242\">Account name\n            <input style=\"height:36px; padding:0 10px; border:1px solid #D1D1D1; border-bottom:2px solid #0F6CBD; border-radius:4px; font-size:14px\">\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:4px; font-size:12px; line-height:16px; font-weight:600; color:#424242\">Emergency secret\n            <input type=\"password\" style=\"height:36px; padding:0 10px; border:1px solid #D1D1D1; border-bottom:2px solid #0F6CBD; border-radius:4px; font-size:14px\">\n          <\u002Flabel>\n          <div style=\"height:38px; display:flex; align-items:center; justify-content:center; background:#B10E1C; color:#FFFFFF; border-radius:4px; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"background:#8B0A11\">Sign in with emergency account<\u002Fdiv>\n          <span style=\"font-size:13px; line-height:19px; color:#616161\">For normal access, <a href=\"#\">sign in with your organisation account<\u002Fa>.<\u002Fspan>\n          <span sc-camel-on-click=\"{{ backToApp }}\" style=\"font-size:13px; line-height:19px; color:#115EA3; cursor:pointer\" style-hover=\"text-decoration:underline\">← Back to the app<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isDenied }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh; background:#F0F0F0; display:flex; align-items:center; justify-content:center; padding:32px\">\n      <div style=\"width:560px; background:#FFFFFF; border-radius:8px; box-shadow:0 8px 16px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12); overflow:hidden\">\n        <div style=\"height:4px; background:#BC4B09\"><\u002Fdiv>\n        <div style=\"padding:28px; display:flex; flex-direction:column; gap:16px\">\n          <div style=\"display:flex; flex-direction:column; gap:8px\">\n            <img src=\"928de21f-62e9-438c-baa6-a548af72e8d7\" alt=\"Emirates Glass\" style=\"height:26px; width:auto; align-self:flex-start; display:block\">\n            <span style=\"font-size:12px; line-height:16px; color:#616161\">Manpower Allocation<\u002Fspan>\n          <\u002Fdiv>\n          <h1 style=\"margin:0; font-size:28px; line-height:36px; font-weight:600\">Access denied<\u002Fh1>\n          <span style=\"font-size:14px; line-height:20px; color:#424242\">You are signed in, but your account has not been granted a role in this application. Contact IT and quote the details below.<\u002Fspan>\n          <div style=\"border:1px solid #E0E0E0; border-radius:4px; overflow:hidden\">\n            <sc-for list=\"{{ deniedRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid; grid-template-columns:150px 1fr; border-bottom:1px solid #F5F5F5\">\n                <div style=\"padding:10px 14px; background:#FAFAFA; font-size:13px; line-height:20px; font-weight:600; color:#424242\">{{ r.k }}<\u002Fdiv>\n                <div style=\"padding:10px 14px; font-size:13px; line-height:20px\">{{ r.v }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <span style=\"font-size:12px; line-height:16px; color:#616161\">IT: grant access by adding this Object ID under Administration → Role Assignments.<\u002Fspan>\n          <div style=\"display:flex; gap:10px\">\n            <div sc-camel-on-click=\"{{ backToApp }}\" style=\"height:32px; padding:0 14px; display:flex; align-items:center; background:#0F6CBD; color:#FFFFFF; border-radius:4px; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"background:#115EA3\">Back to the app<\u002Fdiv>\n            <div style=\"height:32px; padding:0 14px; display:flex; align-items:center; border:1px solid #D1D1D1; border-radius:4px; font-size:14px; cursor:pointer\" style-hover=\"background:#F5F5F5\">Sign out<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showDeptForm }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeDeptForm }}\" style=\"position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:40; padding:24px\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:460px; background:#FFFFFF; border-radius:8px; box-shadow:0 32px 64px rgba(0,0,0,.24); overflow:hidden\">\n        <div style=\"padding:14px 18px; background:#EBF3FC; border-bottom:1px solid #B4D6FA; font-size:20px; line-height:26px; font-weight:600; color:#0C3B5E\">{{ deptFormTitle }}<\u002Fdiv>\n        <div style=\"padding:18px; display:flex; flex-direction:column; gap:14px\">\n          <label style=\"display:flex; flex-direction:column; gap:4px; font-size:12px; line-height:16px; font-weight:600; color:#424242\">Name\n            <input value=\"{{ deptFormName }}\" sc-camel-on-change=\"{{ onDeptName }}\" style=\"height:32px; padding:0 10px; border:1px solid #D1D1D1; border-bottom:2px solid #0F6CBD; border-radius:4px; font-size:14px; color:#242424\">\n          <\u002Flabel>\n          <div style=\"display:flex; gap:10px\">\n            <label style=\"display:flex; flex-direction:column; gap:4px; font-size:12px; line-height:16px; font-weight:600; color:#424242; flex:1\">Day required\n              <input type=\"number\" value=\"{{ deptFormDay }}\" sc-camel-on-change=\"{{ onDeptDay }}\" style=\"height:32px; padding:0 10px; border:1px solid #D1D1D1; border-radius:4px; font-size:14px\">\n            <\u002Flabel>\n            <label style=\"display:flex; flex-direction:column; gap:4px; font-size:12px; line-height:16px; font-weight:600; color:#424242; flex:1\">Night required\n              <input type=\"number\" value=\"{{ deptFormNight }}\" sc-camel-on-change=\"{{ onDeptNight }}\" style=\"height:32px; padding:0 10px; border:1px solid #D1D1D1; border-radius:4px; font-size:14px\">\n            <\u002Flabel>\n            <label style=\"display:flex; flex-direction:column; gap:4px; font-size:12px; line-height:16px; font-weight:600; color:#424242; flex:1\">Sequence\n              <input type=\"number\" step=\"0.5\" value=\"{{ deptFormSeq }}\" sc-camel-on-change=\"{{ onDeptSeq }}\" style=\"height:32px; padding:0 10px; border:1px solid #D1D1D1; border-radius:4px; font-size:14px\">\n            <\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"display:flex; align-items:center; justify-content:flex-end; gap:10px; border-top:1px solid #F0F0F0; padding-top:14px\">\n            <div sc-camel-on-click=\"{{ closeDeptForm }}\" style=\"height:32px; padding:0 14px; display:flex; align-items:center; border:1px solid #D1D1D1; border-radius:4px; font-size:14px; cursor:pointer\" style-hover=\"background:#F5F5F5\">Cancel<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ saveDeptForm }}\" style=\"height:32px; padding:0 14px; display:flex; align-items:center; background:#0F6CBD; color:#FFFFFF; border-radius:4px; font-size:14px; font-weight:600; cursor:pointer; flex:none; white-space:nowrap\" style-hover=\"background:#115EA3\">Save<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startRoute&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;summary&quot;,&quot;division:Egl&quot;,&quot;division:FunctionalSupport&quot;,&quot;division:Brg&quot;,&quot;search&quot;,&quot;admin:roles&quot;,&quot;admin:import&quot;,&quot;admin:attendance&quot;,&quot;admin:shift&quot;,&quot;admin:breakglass&quot;,&quot;admin:audit&quot;,&quot;login&quot;,&quot;denied&quot;],&quot;default&quot;:&quot;division:FunctionalSupport&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;defaultShift&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;All&quot;,&quot;Day&quot;,&quot;Night&quot;],&quot;default&quot;:&quot;All&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;canEdit&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Permissions&quot;},&quot;rosterOpenByDefault&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nconst BRAND='#0F6CBD', BRAND_H='#115EA3', BRAND_D='#0C3B5E',\n  GREEN='#0E700E', GREEN_BG='#F1FAF1', GREEN_BD='#9FD89F',\n  RED='#B10E1C', RED_BG='#FDF3F4', RED_BD='#F1BBBB',\n  AMBER='#BC4B09', AMBER_BG='#FFF9F5', AMBER_BD='#F4C7A8',\n  PURPLE='#5C2E91', PURPLE_BG='#F7F4FB', PURPLE_BD='#D7C9EA',\n  TEAL='#038387', TEAL_BG='#EFFAFA', TEAL_BD='#A6E0E0',\n  MAGENTA='#C239B3', GOLD='#986F0B';\n\nconst DIVISIONS = [\n  { key:'Egl', short:'EGL', label:'EGL Departments', tile:BRAND },\n  { key:'FunctionalSupport', short:'Functional Support', label:'Functional Support Departments', tile:TEAL },\n  { key:'Brg', short:'BRG', label:'BRG Departments', tile:MAGENTA }\n];\n\nconst DEPTS = [\n  { id:1, div:'Egl', name:'Batch House', tile:BRAND, rd:3, rn:2, seq:10 },\n  { id:2, div:'Egl', name:'Furnace', tile:GOLD, rd:4, rn:3, seq:20 },\n  { id:3, div:'Egl', name:'Cold End', tile:TEAL, rd:3, rn:2, seq:30 },\n  { id:4, div:'Egl', name:'Tempering', tile:PURPLE, rd:2, rn:2, seq:40 },\n  { id:5, div:'Egl', name:'Lamination', tile:MAGENTA, rd:2, rn:1, seq:50 },\n  { id:6, div:'FunctionalSupport', name:'HSE', tile:BRAND, rd:3, rn:2, seq:10 },\n  { id:7, div:'FunctionalSupport', name:'Quality Control', tile:TEAL, rd:3, rn:2, seq:20 },\n  { id:8, div:'FunctionalSupport', name:'Warehouse', tile:PURPLE, rd:4, rn:3, seq:30 },\n  { id:9, div:'FunctionalSupport', name:'Maintenance', tile:GOLD, rd:2, rn:2, seq:40 },\n  { id:10, div:'FunctionalSupport', name:'Logistics', tile:MAGENTA, rd:3, rn:2, seq:50 },\n  { id:11, div:'FunctionalSupport', name:'Utilities', tile:GREEN, rd:2, rn:1, seq:60 },\n  { id:12, div:'Brg', name:'Fabrication', tile:BRAND, rd:3, rn:2, seq:10 },\n  { id:13, div:'Brg', name:'Glazing', tile:TEAL, rd:2, rn:2, seq:20 },\n  { id:14, div:'Brg', name:'Dispatch', tile:GOLD, rd:2, rn:1, seq:30 },\n  { id:15, div:'Brg', name:'Site Works', tile:PURPLE, rd:3, rn:1, seq:40 }\n];\n\n// \"Name|shift(D/N)|status(P present, A absent, V vacation, O outsource present)|notes\"\nconst ROSTER = {\n  1: ['Ravi Menon|D|P', 'Sunil Gopal|D|P', 'Ali Rahman|N|P', 'Zubair Khan|N|A|No punch recorded'],\n  2: ['Mohan Das|D|P', 'Iqbal Sheikh|D|P', 'Peter Ochieng|D|A', 'Vinod Kurian|N|P', 'Yusuf Adnan|N|P'],\n  3: ['Deepak Rana|D|P', 'Noel Fernandes|D|P', 'Salim Baksh|N|P'],\n  4: ['Arun Prakash|D|P', 'Tanveer Malik|N|P', 'Hari Chandran|N|V|Annual leave to 02 Aug'],\n  5: ['Basheer Ahmed|D|P', 'Jomon Joseph|D|P', 'Sanjay Rawat|N|O'],\n  6: ['Atta Hussain|D|P', 'Ayush Shrestha|D|P', 'Mohammed Rafi|N|P', 'Srinivas Mathulapuram|D|A|Called in sick'],\n  7: ['Haris Nazeer|D|V|Annual leave to 05 Aug', 'Kevin Otieno|D|P', 'Ramesh Chandra|N|P', 'Sadiq Rehman|D|P', 'Tariq Aziz|N|P'],\n  8: ['Anthony Binomugisha|D|A', 'Based Shah Jalal|N|A', 'Dinesh Kumar|D|P', 'Emmanuel Waweru|D|P', 'Faisal Iqbal|N|P', 'Ganesh Thapa|D|P', 'Hamza Sheikh|N|O', 'Imran Yousaf|D|O'],\n  9: ['Jibin Mathew|D|P', 'Krishna Pillai|N|P', 'Luqman Farid|D|P', 'Manoj Verma|N|P'],\n  10: ['Nabil Hassan|D|P', 'Omar Zayed|D|P', 'Prakash Rana|N|P', 'Qasim Baig|D|P'],\n  11: ['Rajeev Nair|D|P', 'Samir Alam|N|P', 'Tofiq Hussain|D|P'],\n  12: ['Bilal Anwar|D|P', 'Cyril Dsouza|D|P', 'Faheem Raza|N|P', 'Gopal Krishnan|N|A'],\n  13: ['Hussain Mirza|D|P', 'Jaseem Ali|D|V', 'Kiran Shetty|N|P'],\n  14: ['Louis Mwangi|D|P', 'Munir Aslam|N|P', 'Nizar Fahad|D|O'],\n  15: ['Osman Tariq|D|P', 'Pradeep Bhatt|D|P', 'Rafiq Jamil|N|P', 'Sameer Qureshi|D|A']\n};\n\nconst SHIFT = { D:'Day', N:'Night' };\nconst STATUS = { P:'Present', A:'Absent', V:'Vacation', O:'Outsource' };\n\nfunction buildEmployees(){\n  const out = [];\n  let n = 0;\n  Object.keys(ROSTER).forEach(deptId => {\n    ROSTER[deptId].forEach(raw => {\n      const p = raw.split('|');\n      n += 1;\n      out.push({\n        id: n,\n        deptId: Number(deptId),\n        name: p[0],\n        shift: SHIFT[p[1]],\n        status: STATUS[p[2]],\n        notes: p[3] || '',\n        badge: 'EG-' + (1040 + n)\n      });\n    });\n  });\n  return out;\n}\n\nconst ROLE_ROWS = [\n  { name:'Saeed Mubarak', oid:'8f1c2d4e-77aa-4b31-9c65-1c0f2ab9de41', role:'Admin', created:'2026-03-02 08:14' },\n  { name:'Layla Al Hashimi', oid:'2b7e9033-4c18-4f7e-a1d2-99cf3b0e7a55', role:'Admin', created:'2026-03-02 08:22' },\n  { name:'Praveen Nair', oid:'c4d8e1f0-59b2-4a63-8d77-6e2b41f0a8c9', role:'User', created:'2026-04-18 11:05' },\n  { name:'Ahmed Farouk', oid:'71a0c5b6-3d94-4e28-bb51-0af7c9d23e64', role:'Viewer', created:'2026-06-09 14:47' }\n];\n\nconst AUDIT = [\n  { id:1, time:'2026-07-29 18:42:11', user:'Saeed Mubarak', action:'Update', entity:'Employee', record:'EG-1046', bg:false,\n    before:'{\\n  \"status\": \"Absent\",\\n  \"shift\": \"Day\"\\n}', after:'{\\n  \"status\": \"OnVacation\",\\n  \"shift\": \"Day\"\\n}' },\n  { id:2, time:'2026-07-29 17:20:55', user:'Praveen Nair', action:'Update', entity:'Department', record:'8', bg:false,\n    before:'{\\n  \"requiredDay\": 4,\\n  \"requiredNight\": 2\\n}', after:'{\\n  \"requiredDay\": 4,\\n  \"requiredNight\": 3\\n}' },\n  { id:3, time:'2026-07-29 12:03:07', user:'break-glass', action:'Update', entity:'Department', record:'11', bg:true,\n    before:'{\\n  \"isActive\": true\\n}', after:'{\\n  \"isActive\": false\\n}' },\n  { id:4, time:'2026-07-29 09:15:44', user:'Layla Al Hashimi', action:'Create', entity:'Department', record:'15', bg:false,\n    before:'', after:'{\\n  \"name\": \"Site Works\",\\n  \"division\": \"Brg\",\\n  \"requiredDay\": 3,\\n  \"requiredNight\": 1\\n}' },\n  { id:5, time:'2026-07-29 07:02:19', user:'system', action:'Update', entity:'Attendance', record:'sync/auto', bg:false,\n    before:'{\\n  \"present\": 38\\n}', after:'{\\n  \"present\": 41\\n}' },\n  { id:6, time:'2026-07-28 22:41:03', user:'Ahmed Farouk', action:'Sign in', entity:'Session', record:'—', bg:false, before:'', after:'' }\n];\n\nconst badge = (bg, fg, bd) => 'height:20px; display:inline-flex; align-items:center; padding:0 8px; border-radius:4px; font-size:12px; line-height:16px; font-weight:600; background:' + bg + '; color:' + fg + '; border:1px solid ' + bd;\nconst initialsOf = n => n.split(' ').filter(w => w).map(w => w[0]).slice(0,2).join('').toUpperCase();\nconst statusColor = s => s === 'Present' ? GREEN : s === 'Absent' ? RED : s === 'Vacation' ? AMBER : PURPLE;\nconst statusBg = s => s === 'Present' ? GREEN_BG : s === 'Absent' ? RED_BG : s === 'Vacation' ? AMBER_BG : PURPLE_BG;\nconst avatarStyle = s => 'width:26px; height:26px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; background:' + statusBg(s) + '; color:' + statusColor(s) + '; border:1px solid ' + statusColor(s) + '33';\n\nclass Component extends DCLogic {\n  constructor(p){\n    super(p);\n    const active = {}, open = {};\n    DEPTS.forEach(d => { active[d.id] = d.id !== 11; open[d.id] = !!p.rosterOpenByDefault; });\n    this.state = {\n      route: p.startRoute || 'division:FunctionalSupport',\n      shift: p.defaultShift || 'All',\n      emps: buildEmployees(),\n      active, open,\n      query:'', filter:'All', term:'',\n      auditOpen: { 1:false }, bgOnly:false,\n      syncing:false, syncRanAt:'2026-07-29 18:50:12',\n      dayStart:'07:00', nightStart:'19:00',\n      deptForm:null\n    };\n  }\n\n  set(patch){ this.setState(patch); }\n\n  requiredFor(d){\n    const s = this.state.shift;\n    return s === 'Day' ? d.rd : s === 'Night' ? d.rn : d.rd + d.rn;\n  }\n\n  shiftEmps(){\n    const s = this.state.shift;\n    return this.state.emps.filter(e => s === 'All' || e.shift === s);\n  }\n\n  deptStats(d){\n    const people = this.shiftEmps().filter(e => e.deptId === d.id);\n    const count = st => people.filter(e => e.status === st).length;\n    const present = count('Present'), abs = count('Absent'), vac = count('Vacation'), os = count('Outsource');\n    const required = this.requiredFor(d);\n    const isActive = this.state.active[d.id];\n    const variance = present + os - required;\n    const status = !isActive ? 'Off' : variance < 0 ? 'Short' : variance > 0 ? 'Excess' : 'Optimal';\n    return { d, people, present, abs, vac, os, required, variance, status, isActive, onRoll: this.state.emps.filter(e => e.deptId === d.id).length };\n  }\n\n  divisionStats(key){\n    const rows = DEPTS.filter(d => d.div === key).map(d => this.deptStats(d));\n    const sum = k => rows.reduce((a, r) => a + r[k], 0);\n    return {\n      rows,\n      present: sum('present'), required: sum('required'), abs: sum('abs'), vac: sum('vac'), os: sum('os'),\n      onRoll: sum('onRoll'),\n      variance: sum('present') + sum('os') - sum('required'),\n      shortDepts: rows.filter(r => r.status === 'Short').length\n    };\n  }\n\n  panel(title, accent, items){\n    const bg = accent === RED ? RED_BG : accent === AMBER ? AMBER_BG : accent === PURPLE ? PURPLE_BG : TEAL_BG;\n    const bd = accent === RED ? RED_BD : accent === AMBER ? AMBER_BD : accent === PURPLE ? PURPLE_BD : TEAL_BD;\n    return {\n      title,\n      items,\n      empty: items.length === 0,\n      count: String(items.length),\n      headStyle: 'display:flex; align-items:center; gap:8px; padding:10px 16px; background:' + bg + '; border-bottom:1px solid ' + bd,\n      iconStyle: 'width:14px; height:14px; border-radius:3px; background:' + accent,\n      titleStyle: 'font-size:16px; line-height:22px; font-weight:600; color:' + accent,\n      countStyle: 'height:20px; padding:0 8px; border-radius:10px; background:' + accent + '; color:#FFFFFF; font-size:12px; line-height:20px; font-weight:600'\n    };\n  }\n\n  personItems(list){\n    return list.map(e => ({\n      initials: initialsOf(e.name),\n      avatarStyle: avatarStyle(e.status),\n      main: e.name,\n      sub: this.deptName(e.deptId)\n    }));\n  }\n\n  deptName(id){ const d = DEPTS.find(x => x.id === id); return d ? d.name : ''; }\n  divisionOf(id){ const d = DEPTS.find(x => x.id === id); const v = DIVISIONS.find(x => x.key === (d && d.div)); return v ? v.short : ''; }\n\n  navItem(label, route, color, badgeVal){\n    const sel = this.state.route === route;\n    return {\n      label, badge: badgeVal || false,\n      indicator: 'width:3px; height:16px; border-radius:2px; flex:none; background:' + (sel ? BRAND : 'transparent'),\n      iconStyle: 'width:12px; height:12px; border-radius:3px; flex:none; background:' + color + (sel ? '' : '66'),\n      style: 'display:flex; align-items:center; gap:9px; height:36px; padding:0 12px 0 4px; border-radius:4px; font-size:14px; line-height:20px; cursor:pointer; '\n        + (sel ? 'background:#EBF3FC; color:' + BRAND_H + '; font-weight:600' : 'color:#242424'),\n      onClick: () => this.set({ route })\n    };\n  }\n\n  renderVals(){\n    const st = this.state;\n    const route = st.route;\n    const isDivision = route.indexOf('division:') === 0;\n    const divKey = isDivision ? route.slice(9) : null;\n    const div = DIVISIONS.find(d => d.key === divKey);\n    const canEdit = this.props.canEdit !== false;\n\n    const meta = {\n      summary: { crumb:'Home', title:'Factory Summary', hint:'Live presence across EGL, Functional Support and BRG for the selected shift.' },\n      search: { crumb:'Home / Employee Search', title:'Employee Search', hint:'Search by name or badge ID across all divisions.' },\n      'admin:roles': { crumb:'Administration / Role Assignments', title:'Role Assignments', hint:'Grants a role to an Entra ID user by object id. Only this mapping is stored — never a credential.' },\n      'admin:import': { crumb:'Administration / Master Data Import', title:'Master Data Import', hint:'One-time seeding of attendance and requirements from Excel. Every import is written to the audit trail.' },\n      'admin:attendance': { crumb:'Administration / Attendance Sync', title:'Attendance Synchronisation', hint:'Presence is sourced from the biometric attendance view; a background job refreshes it automatically.' },\n      'admin:shift': { crumb:'Administration / Shift Settings', title:'Shift Settings', hint:'Define the working shifts and the operational-day boundary.' },\n      'admin:breakglass': { crumb:'Administration / Break-glass Status', title:'Emergency Break-glass Account', hint:'Read-only status of the emergency account used when Entra ID i andLabel = 'Night ' + st.nightStart + ' →';\n    }\n\n    if (route === 'admin:breakglass') {\n      vals.breakGlassRows = [\n        { k:'Currently enabled', v:'No' },\n        { k:'Enabled at (Asia/Dubai)', v:'—' },\n        { k:'Auto-disables at (Asia/Dubai)', v:'—' },\n        { k:'Last login (Asia/Dubai)', v:'2026-07-29 12:01:48' },\n        { k:'Enable reason', v:'Entra ID outage drill — INC-20482' }\n      ];\n    }\n\n    if (route === 'admin:audit') {\n      const rows = AUDIT.filter(a => !st.bgOnly || a.bg);\n      vals.bgFilterStyle = 'display:flex; align-items:center; gap:8px; height:32px; padding:0 12px; border-radius:16px; font-size:14px; cursor:pointer; border:1px solid ' + (st.bgOnly ? RED : '#D1D1D1') + '; background:' + (st.bgOnly ? RED_BG : '#FFFFFF') + '; color:' + (st.bgOnly ? '#8B0A11' : '#242424');\n      vals.bgCheckStyle = 'width:14px; height:14px; border-radius:3px; border:1px solid ' + (st.bgOnly ? RED : '#616161') + '; background:' + (st.bgOnly ? RED : '#FFFFFF');\n      vals.onToggleBg = () => this.set({ bgOnly: !st.bgOnly });\n      vals.auditCountLine = 'Showing ' + rows.length + ' of ' + AUDIT.length + ' most recent entries';\n      const actionStyle = a => badge(a === 'Create' ? GREEN_BG : a === 'Delete' ? RED_BG : a === 'Update' ? '#EBF3FC' : '#F5F5F5', a === 'Create' ? GREEN : a === 'Delete' ? RED : a === 'Update' ? BRAND_H : '#424242', a === 'Create' ? GREEN_BD : a === 'Delete' ? RED_BD : a === 'Update' ? '#B4D6FA' : '#E0E0E0');\n      vals.auditRows = rows.map(a => {\n        const hasDetail = !!(a.before || a.after);\n        const open = !!st.auditOpen[a.id] && hasDetail;\n        return {\n          time: a.time, user: a.user, action: a.action, entity: a.entity, record: a.record,\n          actionStyle: actionStyle(a.action),\n          bgLabel: a.bg ? 'YES' : '',\n          caret: hasDetail ? (open ? '▾' : '▸') : '',\n          open,\n          before: a.before || '—',\n          after: a.after || '—',\n          rowStyle: 'display:grid; grid-template-columns:32px 1.3fr 1.2fr .8fr 1fr .7fr .9fr; align-items:center; cursor:pointer; background:' + (a.bg ? RED_BG : 'transparent') + (a.bg ? '; box-shadow:inset 3px 0 0 ' + RED : ''),\n          onToggle: () => this.setState(s2 => ({ auditOpen: Object.assign({}, s2.auditOpen, { [a.id]: !s2.auditOpen[a.id] }) }))\n        };\n      });\n    }\n\n    if (route === 'denied') {\n      vals.deniedRows = [\n        { k:'Signed in as', v:'Saeed Mubarak' },\n        { k:'Sign-in name', v:'s.mubarak@emiratesglass.com' },\n        { k:'Entra Object ID', v:'8f1c2d4e-77aa-4b31-9c65-1c0f2ab9de41' }\n      ];\n    }\n\n    const f = st.deptForm;\n    vals.showDeptForm = !!f;\n    vals.deptFormTitle = f && f.id ? 'Edit department' : 'Add department';\n    vals.deptFormName = f ? f.name : '';\n    vals.deptFormDay = f ? String(f.rd) : '0';\n    vals.deptFormNight = f ? String(f.rn) : '0';\n    vals.deptFormSeq = f ? String(f.seq) : '9999';\n    vals.onDeptName = e => this.setState(s2 => ({ deptForm: Object.assign({}, s2.deptForm, { name: e.target.value }) }));\n    vals.onDeptDay = e => this.setState(s2 => ({ deptForm: Object.assign({}, s2.deptForm, { rd: Number(e.target.value) }) }));\n    vals.onDeptNight = e => this.setState(s2 => ({ deptForm: Object.assign({}, s2.deptForm, { rn: Number(e.target.value) }) }));\n    vals.onDeptSeq = e => this.setState(s2 => ({ deptForm: Object.assign({}, s2.deptForm, { seq: Number(e.target.value) }) }));\n    vals.closeDeptForm = () => this.set({ deptForm: null });\n    vals.saveDeptForm = () => {\n      const form = st.deptForm;\n      if (form && form.id) {\n        const d = DEPTS.find(x => x.id === form.id);\n        if (d) { d.rd = form.rd; d.rn = form.rn; d.seq = form.seq; }\n      }\n      this.set({ deptForm: null });\n    };\n\n    return vals;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
